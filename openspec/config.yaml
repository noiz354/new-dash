schema: spec-driven

context: |
  Aligner CMMS (Apex Ops) — facility maintenance platform. Stack: Next.js 16,
  React 18, Tailwind, Drizzle ORM + PGlite, Zod. Code + comments in English.
  Canonical spec catalog is specs/ (consolidated 2026-09-19, observed-only).
  openspec/specs/ stays EMPTY by policy — no migration, no duplication.
  Use openspec/changes only for forward change proposals.
  Before any screen/service work, load the aligner-conventions skill
  (.agents/skills/aligner-conventions/SKILL.md): System A (desktop) vs
  System B (field) tokens, ConfirmDialog guards, EmptyState, append-only
  audit trail, monospace operational IDs.
  Never edit stitch_facility_maintenance_platform_ui/ (frozen reference).

